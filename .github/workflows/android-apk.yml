name: Build Android APK

# Builds an installable release APK on GitHub's runners (which can reach
# Google Maven / the Android SDK). Run it manually from the Actions tab, or
# it runs automatically when app code changes on main. Download the APK from
# the run's "Artifacts" section.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "android/**"
      - "assets/**"
      - "pubspec.yaml"
      - ".github/workflows/android-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.32.5
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: revert2fitrah-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
