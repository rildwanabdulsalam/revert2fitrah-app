name: Build Android APK

# Builds an installable release APK on GitHub's runners (which can reach
# Google Maven / the Android SDK). Run it manually from the Actions tab, or
# it runs automatically when app code changes on main. Download the APK from
# the run's "Artifacts" section.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "android/**"
      - "assets/**"
      - "pubspec.yaml"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.32.5
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: revert2fitrah-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # Publish the APK as a rolling GitHub Release so it has a stable,
      # login-free, single-click download link (not a zipped artifact).
      - name: Publish APK to GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Latest Android APK
          body: >-
            Installable release APK, rebuilt automatically from the latest
            main. Download app-release.apk below and sideload it.
          prerelease: true
          files: build/app/outputs/flutter-apk/app-release.apk
